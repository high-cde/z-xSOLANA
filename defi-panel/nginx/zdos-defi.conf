# ZDOS DeFi · pannello unico /defi/ (Swap, Pool DLMM, Basket, Posizioni, Dev) + API /api/defi/ (zdos-defi su 127.0.0.1:4198)
# Rollback: /var/backups/defi-panel/<ts>/rollback.sh
location = /defi { return 301 /defi/; }
location ^~ /defi/ {
    alias /var/www/defi-panel/current/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
}
location ^~ /api/defi/ {
    proxy_pass http://127.0.0.1:4198;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    add_header X-Robots-Tag "noindex" always;
}
location = /zdos-tag.js {
    alias /var/www/zdos-common/zdos-tag.js;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
}
