# Tag Google unico ZDOS · include nginx DISATTIVATO (non incluso in nessun server finché doc non fornisce l'ID GA4).
# Attivazione: 1) mettere l'ID in /var/www/zdos-common/zdos-tag.js (GA4_ID)
#              2) nei blocchi server 443 aggiungere:  include /etc/nginx/snippets/zdos-gtag.conf;
#              3) per le location con proxy_pass aggiungere: proxy_set_header Accept-Encoding "";
#              4) nginx -t && systemctl reload nginx
# /zdos-tag.js è già servito su x-zdos.it (snippet zdos-defi.conf); sugli altri domini usare l'URL assoluto.
sub_filter_types text/html;
sub_filter_once on;
sub_filter '</head>' '<script src="https://x-zdos.it/zdos-tag.js" defer></script></head>';
