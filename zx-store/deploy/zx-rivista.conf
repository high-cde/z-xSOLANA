# ARIA · rivista digitale 18+ · zx.x-zdos.it/rivista/ (location dedicata, static)
location = /rivista { return 301 /rivista/; }
location ^~ /rivista/ {
    alias /var/www/rivista/;
    index index.html;
    try_files $uri $uri/ =404;
    default_type text/html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "public, max-age=300" always;
    location ~* \.(webp|svg|jpg|png)$ { add_header Cache-Control "public, max-age=604800, immutable" always; add_header X-Content-Type-Options "nosniff" always; }
}
