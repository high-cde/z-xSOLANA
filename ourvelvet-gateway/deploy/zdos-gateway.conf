# OurVelvet Gateway v1 — pagine /gateway/, API /api/gateway/ (zdos-gateway su 127.0.0.1:8912), inbox staff /gateway/staff/ (htpasswd staff esistente, solo letto).
# Nessun pagamento. Rollback: /var/backups/gateway/<ts>/rollback.sh
location = /gateway { return 301 /gateway/; }
location ^~ /api/gateway/admin { return 404; }
location ^~ /api/gateway/ {
    proxy_pass http://127.0.0.1:8912;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Gateway-Admin "";
    proxy_set_header X-Staff-User "";
    client_max_body_size 32k;
    proxy_read_timeout 20s;
}
location = /gateway/staff { return 301 /gateway/staff/; }
location ^~ /gateway/staff/api/ {
    auth_basic "OurVelvet staff";
    auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
    proxy_pass http://127.0.0.1:8912/api/gateway/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Staff-User $remote_user;
    include /etc/nginx/snippets/zdos-gateway-admin-key.conf;
    client_max_body_size 16k;
}
location ^~ /gateway/staff/ {
    auth_basic "OurVelvet staff";
    auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
    alias /var/www/ourvelvet/gateway-staff/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
location ^~ /gateway/ {
    alias /var/www/ourvelvet/gateway/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
