# DSN-X merito: miner merito VELVET + registro zcomm. Nuove location, non modifica i blocchi esistenti.
location = /merito { return 301 /merito/; }
location ^~ /merito/api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:4192;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Radar-Token $http_x_radar_token;
    proxy_read_timeout 30s;
}
location ^~ /zcomm/api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:4192;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
}
location ^~ /merito/ {
    alias /var/www/merito/current/;
    index index.html;
    types { text/html html; text/css css; application/javascript js; image/svg+xml svg; }
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=120" always;
}
