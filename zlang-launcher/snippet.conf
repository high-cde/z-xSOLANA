# ZLang Launcher by ZDOS: demo statica /launcher/ e piano /launcher/piano/ (nessun backend, nessuna chiave, nessuna transazione).
# Rollback: /var/backups/launcher/__TS__/rollback.sh
location = /launcher { return 301 /launcher/; }
location = /launcher/piano { return 301 /launcher/piano/; }
location ^~ /launcher/ {
    alias /var/www/zlang-launcher/;
    index index.html;
    sub_filter "</head>" "</head>";   # nessuna iniezione di script esterni su queste pagine
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
}
