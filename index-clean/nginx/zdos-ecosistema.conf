# Ecosistema pubblico ZDOS × Velvet — pagina /ecosistema/ (rollback: /var/backups/ecosistema/<ts>/rollback.sh)
location = /ecosistema { return 301 /ecosistema/; }
location ^~ /ecosistema/ {
    alias /var/www/ecosistema/current/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
