# Aggiunto in /etc/nginx/sites-enabled/x-zdos-unified, nel server 443 di x-zdos.it, prima di "location / {":
# la home "/" non riceve più il pulsante flottante zdos-dock; il tag Google (/zdos-tag.js) resta iniettato.
location = / {
    sub_filter "</head>" "<script src=\"/zdos-tag.js\" defer></script></head>";
    sub_filter_once on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    try_files /index.html =404;
}
