# Privacy e Termini OurVelvet (statici). Rollback: /var/backups/restyle/<ts>/rollback.sh
location = /privacy { return 301 /privacy/; }
location ^~ /privacy/ { alias /var/www/ourvelvet/privacy/; index index.html; add_header Cache-Control "no-cache" always; }
location = /termini { return 301 /termini/; }
location ^~ /termini/ { alias /var/www/ourvelvet/termini/; index index.html; add_header Cache-Control "no-cache" always; }
