# OurVelvet Social v1 — API /api/social/ (zdos-social su 127.0.0.1:8910) e moderazione staff /creator-radar/admin/ (htpasswd staff esistente).
# Rollback: /var/backups/social/<ts>/rollback.sh
location ^~ /api/social/admin { return 404; }
location ^~ /api/social/ {
    proxy_pass http://127.0.0.1:8910;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Social-Admin "";
    proxy_set_header X-Staff-User "";
    client_max_body_size 6m;
    proxy_read_timeout 30s;
}
location = /creator-radar/admin { return 301 /creator-radar/admin/; }
location ^~ /creator-radar/admin/api/ {
    auth_basic "OurVelvet staff";
    auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
    proxy_pass http://127.0.0.1:8910/api/social/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Staff-User $remote_user;
    include /etc/nginx/snippets/zdos-social-admin-key.conf;
    client_max_body_size 16k;
}
location ^~ /creator-radar/admin/ {
    auth_basic "OurVelvet staff";
    auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
    alias /var/www/ourvelvet/creator-admin/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
