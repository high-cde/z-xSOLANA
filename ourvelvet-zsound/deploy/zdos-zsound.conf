# Z-Sound · studio DJ dei creator (pagina statica) + upload audio per il profilo. © 2026 ZDOS1.3
# Incluso nel blocco 443 di ourvelvet.online. Rollback: /var/backups/zsound/<ts>/rollback.sh
location = /creator/z-sound { return 301 /creator/z-sound/; }
location ^~ /creator/z-sound/ {
    alias /var/www/ourvelvet/z-sound/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "midi=(self), microphone=(), camera=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
}
# caricamento audio (WAV/WebM/OGG/MP3/M4A, max 25 MB): limite dedicato, tutto il resto di /api/social/ resta a 6 MB
location = /api/social/audio {
    proxy_pass http://127.0.0.1:8910;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Social-Admin "";
    proxy_set_header X-Staff-User "";
    client_max_body_size 26m;
    client_body_timeout 60s;
    proxy_read_timeout 60s;
}
