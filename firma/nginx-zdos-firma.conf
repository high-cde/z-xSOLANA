# Firma ZDOS / OurVelvet v1 — pagina /verifica/, asset /firma/ e API /api/firma/ (servizio zdos-firma su 127.0.0.1:8905).
# Incluso nei blocchi 443 di x-zdos.it, zx.x-zdos.it, ourvelvet.online. Rollback: /var/backups/firma/<ts>/rollback.sh
location = /verifica { return 301 /verifica/; }
location ^~ /verifica/ {
    alias /var/www/firma/verifica/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
}
location ^~ /firma/ {
    alias /var/www/firma/firma/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
}
location ^~ /api/firma/ {
    proxy_pass http://127.0.0.1:8905;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    proxy_read_timeout 15s;
}
