[package]
name = "organism-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dipendenza locale verso il cortex
zdos_cortex = { package = "cortex", path = "../cortex" }
zdos-core = { path = "../core" }
zdos-zvm = { path = "../zvm" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zdos-zlang = { path = "../zlang" }
